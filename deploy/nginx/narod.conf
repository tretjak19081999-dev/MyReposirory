server {
    listen 80;
    listen [::]:80;
    server_name народпобедителей.рф www.народпобедителей.рф xn--80acibebawlsonbnm4b.xn--p1ai www.xn--80acibebawlsonbnm4b.xn--p1ai;
    return 301 https://xn--80acibebawlsonbnm4b.xn--p1ai$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.народпобедителей.рф www.xn--80acibebawlsonbnm4b.xn--p1ai;

    ssl_certificate /etc/letsencrypt/live/xn--80acibebawlsonbnm4b.xn--p1ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/xn--80acibebawlsonbnm4b.xn--p1ai/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_protocols TLSv1.2 TLSv1.3;

    return 301 https://xn--80acibebawlsonbnm4b.xn--p1ai$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name народпобедителей.рф xn--80acibebawlsonbnm4b.xn--p1ai;

    ssl_certificate /etc/letsencrypt/live/xn--80acibebawlsonbnm4b.xn--p1ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/xn--80acibebawlsonbnm4b.xn--p1ai/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /var/www/narod;
    index index.html;
    error_page 404 /404.html;

    location /api/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 32k;
    }

    location /panel/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
